[project]
name = "ai-doc-assistant"
version = "1.0.0"
description = "RAG demo: upload documents and ask questions with citations (FastAPI + ChromaDB + OpenAI)."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
# Runtime dependencies. requirements.txt mirrors this list for the Docker/Render build;
# keep both in step (uv.lock is the CI source of truth).
dependencies = [
    "numpy<2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",
    "chromadb>=0.5",
    "openai>=1.50",
    # pypdf replaces PyPDF2 3.0.1 (unfixed infinite-loop DoS on crafted PDFs, PYSEC-2026-1835).
    "pypdf>=6.21.0",
    "python-docx>=1.1.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0.0",
    # Floors for transitive dependencies with known vulnerabilities below these versions.
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
    "orjson>=3.11.5",
    "requests>=2.33.0",
    # Error reporting (observability.py); inert unless SENTRY_DSN is set.
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7",
    "httpx>=0.27",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.uv]
# Flat application modules (main.py, rag_engine.py, ...), not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["."]
omit = ["test_*.py", ".venv/*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["DOCPACK", "sample-documents", "static"]

[tool.ruff.lint]
select = ["E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
exclude = ["^\\.venv/", "^DOCPACK/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# chromadb, python-docx and sentry-sdk ship partial or no stubs for the calls used here.
module = ["chromadb.*", "docx.*", "sentry_sdk.*"]
ignore_missing_imports = true
