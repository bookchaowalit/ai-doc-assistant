<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG-as-a-Service — Demo Chat</title>
  <style>
    :root {
      --primary: #1a56db;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --user-bg: #dbeafe;
      --bot-bg: #f1f5f9;
      --accent: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Thai', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    .header { background: var(--primary); color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 1.2rem; }
    .header .status { font-size: 0.8rem; opacity: 0.8; }
    .stats-badge { background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; }

    /* Upload area */
    .upload-area { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
    .upload-area label { cursor: pointer; background: var(--primary); color: white; padding: 8px 16px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }
    .upload-area label:hover { opacity: 0.9; }
    .upload-area:focus-within label { outline: 3px solid var(--accent); outline-offset: 2px; }
    .upload-area input { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .upload-status { font-size: 0.85rem; color: var(--muted); }

    /* Chat */
    .chat-container { flex: 1; overflow-y: auto; padding: 24px; }
    .message { max-width: 700px; margin: 0 auto 16px; display: flex; gap: 12px; }
    .message.user { flex-direction: row-reverse; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .message.user .avatar { background: var(--user-bg); }
    .message.bot .avatar { background: var(--bot-bg); }
    .bubble { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.6; font-size: 0.95rem; overflow-wrap: anywhere; }
    .message.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
    .message.bot .bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .sources { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
    .sources summary { font-size: 0.8rem; color: var(--muted); cursor: pointer; }
    .source-item { font-size: 0.8rem; color: var(--muted); padding: 4px 0; overflow-wrap: anywhere; }
    .meta { margin-top: 8px; font-size: 0.75rem; color: var(--muted); display: flex; gap: 12px; }
    .message.bot.not-found .bubble { border-color: var(--accent); background: #fffbeb; }

    /* Input */
    .input-area { background: var(--card); border-top: 1px solid var(--border); padding: 16px 24px; }
    .input-wrapper { max-width: 700px; margin: 0 auto; display: flex; gap: 12px; }
    .input-wrapper input { flex: 1; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
    .input-wrapper input:focus { border-color: var(--primary); }
    .input-wrapper button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .input-wrapper button:hover { opacity: 0.9; }
    .input-wrapper button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Welcome */
    .welcome { text-align: center; padding: 48px 24px; color: var(--muted); }
    .welcome h2 { color: var(--text); margin-bottom: 8px; }
    .welcome .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
    .welcome .example-btn { background: var(--card); border: 1px solid var(--border); padding: 8px 16px; min-height: 44px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
    .welcome .example-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Loading */
    .typing { display: flex; gap: 4px; padding: 8px 0; }
    .typing span { width: 8px; height: 8px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .typing span { animation: none; } }
    @media (max-width: 600px) {
      .header, .upload-area, .input-area { padding-inline: 16px; }
      .chat-container { padding: 16px; }
      .input-wrapper { flex-wrap: wrap; }
      .input-wrapper input { min-width: 0; }
      .input-wrapper button { flex: 0 0 100%; }
    }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>🤖 RAG-as-a-Service</h1>
    <div class="status">Demo — Upload documents, then ask questions</div>
  </div>
  <div class="stats-badge" id="stats" role="status" aria-live="polite" aria-atomic="true">0 documents</div>
</div>

<div class="upload-area">
  <label for="file-input">📎 Upload Document</label>
  <input type="file" id="file-input" accept=".pdf,.docx,.txt">
  <span class="upload-status" id="upload-status" role="status" aria-live="polite" aria-atomic="true">Supported: PDF, DOCX, TXT</span>
</div>

<div class="chat-container" id="chat" role="log" aria-live="polite" aria-atomic="false" aria-busy="false" aria-label="Conversation">
  <div class="welcome" id="welcome">
    <h2>ถามคำถามเกี่ยวกับเอกสารของคุณ</h2>
    <p>อัปโหลดเอกสาร แล้วถามคำถาม — ระบบจะตอบพร้อมแหล่งอ้างอิง</p>
    <div class="examples">
      <button class="example-btn" onclick="askExample(this)">What is the refund policy?</button>
      <button class="example-btn" onclick="askExample(this)">สรุปเอกสารนี้ให้หน่อย</button>
      <button class="example-btn" onclick="askExample(this)">เงื่อนไขการยกเลิกสัญญาคืออะไร?</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <label class="visually-hidden" for="question">คำถาม</label>
    <input type="text" id="question" placeholder="พิมพ์คำถาม..." autocomplete="off" enterkeyhint="send" onkeydown="if(event.key==='Enter')ask()">
    <button type="button" id="send-btn" aria-controls="chat" onclick="ask()">ถาม</button>
  </div>
</div>

<script>
const API = window.location.origin;

// File upload
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById('upload-status');
  status.textContent = `Uploading ${file.name}...`;
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch(`${API}/upload`, { method: 'POST', body: form });
    const data = await res.json();
    if (res.ok) {
      status.textContent = `✅ ${data.chunks_created} chunks from ${file.name}`;
      refreshStats();
    } else {
      status.textContent = `❌ ${data.detail}`;
    }
  } catch (err) {
    status.textContent = `❌ Upload failed: ${err.message}`;
  }
  e.target.value = '';
});

// Chat
function addMessage(role, text, sources, meta) {
  document.getElementById('welcome')?.remove();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.setAttribute('role', 'article');
  div.setAttribute('aria-label', role === 'user' ? 'คำถามของผู้ใช้' : 'คำตอบของผู้ช่วย');
  if (meta && meta.grounded === false) div.className += ' not-found';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.setAttribute('aria-hidden', 'true');
  avatar.textContent = role === 'user' ? '👤' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.appendChild(document.createTextNode(String(text ?? '')));
  if (Array.isArray(sources) && sources.length > 0) {
    const details = document.createElement('details');
    details.className = 'sources';
    const summary = document.createElement('summary');
    summary.textContent = `📚 ${sources.length} sources`;
    details.appendChild(summary);
    sources.forEach((source, index) => {
      const item = document.createElement('div');
      item.className = 'source-item';
      item.textContent = `[${index + 1}] ${source?.source ?? 'Unknown source'} (chunk ${source?.chunk_id ?? 'unknown'})`;
      details.appendChild(item);
    });
    bubble.appendChild(details);
  }
  if (meta) {
    const metrics = document.createElement('div');
    metrics.className = 'meta';
    const latency = Number.isFinite(meta.latency_ms) ? `${meta.latency_ms} ms` : 'unavailable';
    const cost = Number.isFinite(meta.cost_usd) ? `$${meta.cost_usd.toFixed(6)}` : 'unavailable';
    metrics.textContent = `⏱ ${latency} · 💵 ${cost}`;
    bubble.appendChild(metrics);
  }
  div.append(avatar, bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTyping() {
  document.getElementById('welcome')?.remove();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typing-indicator';
  div.setAttribute('role', 'status');
  div.setAttribute('aria-label', 'กำลังคิดคำตอบ');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.setAttribute('aria-hidden', 'true');
  avatar.textContent = '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.setAttribute('aria-hidden', 'true');
  typing.append(document.createElement('span'), document.createElement('span'), document.createElement('span'));
  bubble.appendChild(typing);
  div.append(avatar, bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing-indicator')?.remove();
}

async function ask() {
  const input = document.getElementById('question');
  const sendButton = document.getElementById('send-btn');
  const chat = document.getElementById('chat');
  if (sendButton.disabled) return;
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  sendButton.disabled = true;
  chat.setAttribute('aria-busy', 'true');
  addMessage('user', q);
  addTyping();
  try {
    const res = await fetch(`${API}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, top_k: 3 })
    });
    removeTyping();
    const data = await res.json();
    if (res.ok) {
      addMessage('bot', data.answer, data.sources, {
        latency_ms: data.latency_ms,
        cost_usd: data.cost_usd,
        grounded: data.grounded
      });
    } else {
      addMessage('bot', `❌ Error: ${data.detail}`);
    }
  } catch (err) {
    removeTyping();
    addMessage('bot', `❌ Request failed: ${err.message}`);
  }
  sendButton.disabled = false;
  chat.setAttribute('aria-busy', 'false');
  input.focus();
}

function askExample(btn) {
  document.getElementById('question').value = btn.textContent;
  ask();
}

async function refreshStats() {
  try {
    const res = await fetch(`${API}/stats`);
    const data = await res.json();
    document.getElementById('stats').textContent = `${data.total_documents} docs · ${data.total_chunks} chunks`;
  } catch {}
}
refreshStats();
setInterval(refreshStats, 30000);
</script>
</body>
</html>
