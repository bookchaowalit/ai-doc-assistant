# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.11" # matches the Dockerfile (python:3.11-slim)
      # Installs from uv.lock (uv sync --frozen --all-extras); ruff + mypy come from the dev extra,
      # mypy runs from [tool.mypy]. Tests are offline: no OpenAI call, provider always mocked or unset.
      # Ratchet: measured 90.72% on 2026-10-22 (ADR-0004: threshold = measured, rounded down).
      coverage-threshold: "90"

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  image:
    # Builds the Dockerfile and scans the image with Trivy (packages inside the image, which the
    # Trivy fs scan cannot see). Blocking: a fixable HIGH/CRITICAL finding fails CI (and so Railway's Wait for CI).
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/image-scan.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
